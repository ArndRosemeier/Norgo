<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norgo — Items Sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; color: #ddd; font: 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
      #bar { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; gap: 8px; align-items: center; padding: 0 10px; background: #1d2026; border-bottom: 1px solid #333; z-index: 5; }
      #bar input, #bar select, #bar button { background: #2a2e36; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font: inherit; }
      #view { position: absolute; top: 40px; left: 0; right: 380px; bottom: 0; }
      #side { position: absolute; top: 40px; right: 0; width: 380px; bottom: 0; overflow-y: auto; background: #181a1f; border-left: 1px solid #333; }
      .card { display: flex; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #262930; cursor: pointer; }
      .card:hover, .card.sel { background: #232731; }
      .card img { width: 56px; height: 56px; flex: none; background: #0e0f12; border-radius: 4px; }
      .nm { font-weight: 600; }
      .sub { color: #999; font-size: 11px; }
      #tip { position: absolute; pointer-events: none; z-index: 10; max-width: 320px; background: rgba(16,17,21,.96); border: 1px solid #555; border-radius: 6px; padding: 8px 10px; display: none; white-space: pre-wrap; }
      /* Other teams' in-progress compile errors must not cover this page. */
      vite-error-overlay { display: none; }
      .label { position: absolute; transform: translate(-50%, 0); font-size: 10px; color: #bbb; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="bar">
      <b>Items</b>
      <label>Seed <input id="seed" value="1" size="6" /></label>
      <label>Filter <input id="filter" placeholder="id / shape / category" size="18" /></label>
      <label>Mode <select id="mode"><option value="defs">All bases</option><option value="loot">Loot rolls</option><option value="uniques">Uniques</option><option value="outfits">NPC outfits</option></select></label>
      <label>Level <input id="level" value="10" size="3" /></label>
      <label>Style <select id="style"><option value="">(rolled)</option></select></label>
      <button id="go">Generate</button>
      <span id="stats" class="sub"></span>
    </div>
    <div id="view"></div>
    <div id="side"></div>
    <div id="tip"></div>
    <script type="module" src="/src/sandbox/items.ts"></script>
  </body>
</html>
