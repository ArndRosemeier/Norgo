<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norgo — Gameplay &amp; FX Sandbox</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #d8dce6; font: 12px/1.35 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #panel { position: fixed; left: 0; top: 0; bottom: 0; width: 330px; overflow-y: auto; background: rgba(16, 18, 26, 0.88); border-right: 1px solid #2a2f3c; padding: 8px 10px 40px; box-sizing: border-box; }
      #panel h1 { font-size: 15px; margin: 2px 0 6px; color: #e8ecff; }
      #panel h2 { font-size: 11px; margin: 12px 0 4px; color: #9fb4ff; text-transform: uppercase; letter-spacing: 0.07em; }
      #panel h3 { font-size: 11px; margin: 6px 0 2px; color: #c9b38a; }
      button { background: #232a3a; color: #e4e8f2; border: 1px solid #343d52; border-radius: 4px; padding: 2px 6px; margin: 1px; cursor: pointer; font-size: 11px; }
      button:hover { background: #33405c; }
      button.on { background: #4a5e9a; border-color: #6c82c8; }
      button.locked { opacity: 0.45; }
      label { display: inline-flex; align-items: center; gap: 4px; margin: 2px 8px 2px 0; }
      input[type=range] { width: 120px; }
      select { background: #232837; color: #e4e8f2; border: 1px solid #3a4359; border-radius: 4px; }
      #hud { position: fixed; right: 8px; top: 8px; font: 11px monospace; color: #fff; text-shadow: 0 0 3px #000; white-space: pre; text-align: right; pointer-events: none; }
      #tip { position: fixed; right: 8px; bottom: 8px; max-width: 360px; background: rgba(16, 18, 26, 0.9); border: 1px solid #2a2f3c; border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; display: none; }
      #log { font: 11px monospace; color: #a8b0c4; max-height: 120px; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <div id="hud"></div>
    <div id="tip"></div>
    <script type="module" src="/src/sandbox/gameplay.ts"></script>
  </body>
</html>
